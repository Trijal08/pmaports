# WirePlumber defaults a new sink to 40%. On this board the only playback
# control is the rk817's digital DAC volume (Master Playback Volume, -95..0 dB
# over 0..255), so 40% lands around -20 dB and both speakers and headphones are
# barely audible. There is no analog output gain control to make up for it --
# the mainline rk817 codec driver never programs the analog stage at all.
#
# Start sinks at full scale and let EmulationStation attenuate from there.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
