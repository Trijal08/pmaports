# Keep ModemManager at debug log level while the Samsung SIT plugin is in
# bring-up: the SIT frame traces (message IDs, tokens, status) are the primary
# diagnostic for modem issues and are cheap to keep enabled.
#
# Named zz-* so it sorts after postmarketos-base-ui-modemmanager-systemd's
# quick-suspend-resume.conf: systemd applies drop-ins in lexical order and the
# last ExecStart= reset wins, so this file must re-state the full command line
# (including --test-quick-suspend-resume from that drop-in).
[Service]
ExecStart=
ExecStart=/usr/sbin/ModemManager --test-quick-suspend-resume --log-level=DEBUG
