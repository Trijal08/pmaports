# The CP reads Android system properties from the AP over GIPC, and
# exynos-modem answers them from one file per property name. Seed the five 5G
# properties that stock Android has set on komodo -- read off the running
# device -- because they are the only AP-side input to the CP's 5G
# configuration we can see, and an unpublished property reads as the empty
# string.
#
# Not RuntimeDirectory= in the unit: that is removed when the service stops, so
# a restart (Restart=always) would drop the values.
d /run/exynos-modem 0755 root root -
d /run/exynos-modem/properties 0755 root root -
f+ /run/exynos-modem/properties/persist.vendor.radio.5g 0644 root root - 3
f+ /run/exynos-modem/properties/persist.vendor.radio.5g_mode_pref 0644 root root - 3
f+ /run/exynos-modem/properties/ro.vendor.radio.5g 0644 root root - 3
f+ /run/exynos-modem/properties/persist.radio.nr_mode 0644 root root - 1
f+ /run/exynos-modem/properties/persist.vendor.ril.support_nr_ds 0644 root root - 1
