# unudhcpd resolves its interface to an ifindex once at startup and binds
# there for good. usb-signaller destroys and recreates the USB gadget on every
# mode switch, so usb0 comes back with a new ifindex and the server is left
# answering on a dead one:
#
#	usb0 ifindex: 8
#	ss -lunp -> UNCONN 0 0 0.0.0.0%if7:67
#
# It fails silently: the process never exits, so Restart=always never fires.
# The host gets no DHCP reply, falls back to a 169.254 link-local address, and
# 172.16.42.1 stays unreachable until the next reboot.
#
# Bind the service to the netdev unit instead, so systemd stops it when usb0
# disappears and starts it again when the gadget is rebuilt, re-resolving the
# interface each time. The paired .wants symlink is what starts it on the way
# back up.
[Unit]
BindsTo=sys-subsystem-net-devices-%i.device
After=sys-subsystem-net-devices-%i.device
