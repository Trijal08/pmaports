<?xml version="1.0" encoding="UTF-8"?>
<!--
  Derived from ArchR's generated es_systems.cfg (125 systems).

  Changes for postmarketOS:
    <command>  /usr/bin/runemu.sh -> retroarch with a literal core path.
               ES only expands %CORE% when a core is chosen through its
               emulator settings, which ArchR handles inside runemu.sh; with
               that gone, %CORE% reached retroarch verbatim and every launch
               failed. Each system now names the core actually installed,
               resolved against /usr/lib/libretro (so e.g. beetle-saturn is
               written as its real mednafen_saturn_libretro.so).
    <path>     /storage/roms -> ~/ROMs
    systems    37 dropped for having no core available on Alpine (Amiga,
               Commodore 8-bit, X68000, PC-88/98, PICO-8, TIC-80 and similar);
               psp and doom use the standalone ppsspp and gzdoom.
-->
