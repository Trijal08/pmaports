# The AoC's PCMs implement read/write access only. Asking for mmap gets
# "Access type not available" from the driver, and PipeWire prefers mmap: it
# then takes an XRUN on the very first cycle, and every recovery leaves
# snd_pcm_avail returning -EPIPE, so the sink never advances a single quantum.
# The symptom is silence with a sink that looks perfectly healthy -- state
# RUNNING, unmuted, the right UCM verb and port -- while streams pile up
# unplayed and pipewire logs "snd_pcm_avail after recover: Broken pipe" a few
# dozen times a second.
#
# alsa-lib's own read/write path works, which is why speaker-test and aplay
# are audible while everything through PipeWire is not.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-aoc-sound.*" }
      { node.name = "~alsa_input.platform-aoc-sound.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mmap = true
      }
    }
  }
]
