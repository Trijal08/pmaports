# PipeWire's default minimum quantum is 32 samples. On a 1.5 GHz Cortex-A35
# that is far smaller than the CPU can reliably keep fed while an emulator is
# running, so every scheduling hiccup becomes an underrun and the audio
# crackles or stutters.
#
# ArchR patches the same value to 960 on this SoC ("quantum audio hack"),
# trading about 20 ms of latency for buffers that survive load. Emulation is
# not latency critical at that scale.
context.properties = {
    default.clock.min-quantum = 960
}
