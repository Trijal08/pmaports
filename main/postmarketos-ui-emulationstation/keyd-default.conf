# The R36S volume rocker is an adc-keys device emitting KEY_VOLUMEUP and
# KEY_VOLUMEDOWN. Nothing else in a cage session acts on media keys -- ArchR
# handles them in its own ES build via /usr/bin/volume, which does not exist
# here -- so bind them directly.
#
# keyd only grabs keyboard-class devices, so the merged "Fake Gamepad" (a
# joystick) is untouched and EmulationStation still sees every button.

[ids]
*

[main]
volumeup = command(/usr/bin/r36s-volume 5%+)
volumedown = command(/usr/bin/r36s-volume 5%-)
