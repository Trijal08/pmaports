# System-wide RetroArch defaults for the R36S. RetroArch reads /etc/retroarch.cfg
# before the per-user config, so this only sets what the device needs and leaves
# everything else to RetroArch's own defaults.

input_driver = "udev"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"

# SELECT is the hotkey modifier, so SELECT+START exits back to EmulationStation
# and SELECT+X opens the RetroArch menu. Button numbers match the merged
# "Fake Gamepad" the r36s-mapper creates.
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "2"
