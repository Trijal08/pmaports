# Seeded once into ~/.config/gzdoom/ by the session script. GZDoom ships no
# joystick bindings whatsoever, so without this the pad does nothing at all.
#
# Joy numbers are this board's merged pad in evdev order, which is the same
# order RetroArch's Switch Pro profile uses - BTN_C is absent and BTN_Z
# (Capture) is present but unused, so:
#
#   Joy1 bottom(B)  Joy2 right(A)  Joy3 top(X)   Joy4 left(Y)  Joy5 Capture
#
# but GZDoom names the face buttons positionally the way SDL does, so its
# idea of A is this board's B and its X is this board's Y. Both pairs come
# out mirrored from the printed labels, which is the usual Nintendo-layout
# problem. Verified on the device: use sits on A, jump on B.
#   Joy6 L1         Joy7 R1        Joy8 L2       Joy9 R2
#   Joy10 SELECT    Joy11 START    Joy12 HOME    Joy13/14 stick clicks
#
# GZDoom rewrites this file on exit, so anything changed in its own menus
# sticks; it is only ever seeded when absent.

[IWADSearch.Directories]
Path=~/ROMs/doom
Path=$DOOMWADDIR
Path=/usr/share/games/doom

[FileSearch.Directories]
Path=~/ROMs/doom
Path=/usr/share/games/doom

[SoundfontSearch.Directories]
Path=$PROGDIR/soundfonts
Path=/usr/share/games/doom/soundfonts

[GlobalSettings]
use_joystick=true
vid_defwidth=640
vid_defheight=480
vid_aspect=3
fullscreen=true
gl_es=true

[Doom.Bindings]
Joy9=+attack
Joy8=+altattack
Joy2=+use
Joy1=+jump
Joy4=+crouch
Joy3=+speed
Joy6=weapprev
Joy7=weapnext
Joy10=togglemap
Joy11=menu_main
Joy13=centerview

[Doom.AutomapBindings]
Joy6=+am_zoomout
Joy7=+am_zoomin

# GZDoom identifies joysticks by index, and on this board it calls the pad
# JS:1, not JS:0 - it reads the legacy /dev/input/jsN interface, where the
# d-pad counts as two more axes, so it sees six where SDL's evdev path sees
# four plus a hat. Both names are written because the index is not ours to
# pin down; a section for a device that is not there is ignored.
#
# Without this GZDoom uses its built-in defaults - axis0 Side, axis1 Forward,
# axis2 Pitch, axis3 Yaw - which puts turning on the right stick's VERTICAL
# axis: pushing up turns left. Axis 2 is turning and axis 3 is looking.
#
#   -1 none   0 turning   1 looking up/down   2 forward   3 strafing   4 up/down

[Joy:JS:0]
Axis0deadzone=0.200001
Axis0scale=0.8
Axis1deadzone=0.200001
Axis1scale=0.6
Axis2deadzone=0.200001
Axis2scale=0.6
Axis2map=0
Axis3deadzone=0.400001
Axis3scale=0.2
Axis3map=1

[Joy:JS:1]
Axis0deadzone=0.200001
Axis0scale=0.8
Axis1deadzone=0.200001
Axis1scale=0.6
Axis2deadzone=0.200001
Axis2scale=0.6
Axis2map=0
Axis3deadzone=0.400001
Axis3scale=0.2
Axis3map=1
